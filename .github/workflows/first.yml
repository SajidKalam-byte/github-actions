name: First Workflow
on: [push, workflow_dispatch] #manual trigger added

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hell, Github Actions!"


  # second job that depends on 'hello'
  goodbye:
    runs-on: ubuntu-latest
    needs: hello
    steps:
      - name: Print another message
        run: echo "Goodbye from the second job!"
